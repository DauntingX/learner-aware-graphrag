  - {source: overfitting, target: regularization, type: prerequisite_of}
  - {source: bias_variance, target: overfitting, type: prerequisite_of}
  - {source: cross_validation, target: bias_variance, type: prerequisite_of, note: 交叉验证是估计泛化误差的手段}
  - {source: decision_tree, target: bias_variance, type: related_to}

  # --- 深度学习内部 ---
  - {source: backpropagation, target: mlp, type: prerequisite_of}
  - {source: activation_function, target: mlp, type: prerequisite_of}
  - {source: mlp, target: cnn, type: prerequisite_of}
  - {source: mlp, target: rnn, type: prerequisite_of}
  - {source: rnn, target: lstm, type: prerequisite_of}
