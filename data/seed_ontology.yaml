  - {source: fine_tuning, target: sft, type: prerequisite_of}
  - {source: sft, target: rlhf, type: prerequisite_of}
  - {source: reward_model, target: rlhf, type: prerequisite_of}
  - {source: rlhf, target: dpo, type: prerequisite_of}
  - {source: peft, target: lora, type: prerequisite_of}
  - {source: lora, target: qlora, type: prerequisite_of}
  - {source: quantization, target: qlora, type: prerequisite_of}
